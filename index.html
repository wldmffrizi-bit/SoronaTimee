/* SONORA visual refresh */
:root{--bg:#080A12;--bg2:#101525;--elev:#171D2E;--surface:#202A40;--line:rgba(184,197,255,.12);--violet:#9B8CFF;--cyan:#5DE4F2;--soft:#C6BDFF}
body{background:radial-gradient(ellipse at 12% -8%,rgba(117,91,255,.22),transparent 38%),radial-gradient(ellipse at 100% 24%,rgba(36,195,211,.12),transparent 34%),#080A12}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.24;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
.topbar{position:relative}.brand-mark{box-shadow:0 0 28px rgba(93,228,242,.22),0 0 22px rgba(155,140,255,.24)}
.brand-name{letter-spacing:.24em;text-shadow:0 0 22px rgba(155,140,255,.25)}
.page-title{background:linear-gradient(105deg,#fff 15%,#c8c0ff 58%,#83eaf2);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-strip{background:linear-gradient(118deg,rgba(125,104,255,.2),rgba(45,204,220,.09) 65%,rgba(255,255,255,.025));border-color:rgba(183,174,255,.22);box-shadow:inset 0 1px rgba(255,255,255,.06),0 18px 42px rgba(0,0,0,.18)}
.stat,.quick-card,.playlist-card,.settings-row,.range-row,.muted-card{background:linear-gradient(145deg,rgba(28,36,57,.92),rgba(15,20,34,.92));border-color:rgba(186,198,255,.12);box-shadow:inset 0 1px rgba(255,255,255,.035)}
.quick-card,.playlist-card,.settings-row,.icon-btn,.secondary{transition:transform .16s ease,border-color .16s ease,background .16s ease}
.quick-card:active,.playlist-card:active,.settings-row:active,.icon-btn:active,.secondary:active{transform:scale(.975);border-color:rgba(155,140,255,.45)}
.art{box-shadow:0 12px 28px rgba(0,0,0,.2)}
.now-art{box-shadow:0 28px 65px rgba(0,0,0,.48),0 0 0 1px rgba(255,255,255,.08)}
.primary{background:linear-gradient(110deg,#a99aff,#65e3ef);box-shadow:0 9px 28px rgba(104,145,255,.2)}
.icon-btn{background:rgba(255,255,255,.055);backdrop-filter:blur(12px)}
.bottom-nav{background:rgba(8,11,20,.94);border-top-color:rgba(186,198,255,.14)}
.mini-inner{background:linear-gradient(110deg,rgba(33,39,62,.97),rgba(20,34,49,.97));border-color:rgba(186,198,255,.17);backdrop-filter:blur(18px)}
.section{margin-top:32px}
.volume-panel{margin-top:18px;padding:16px;border:1px solid rgba(186,198,255,.14);border-radius:18px;background:linear-gradient(130deg,rgba(155,140,255,.12),rgba(93,228,242,.055));}
.volume-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px;font-size:12px;font-weight:700}
.volume-head span:last-child{color:var(--soft);font-variant-numeric:tabular-nums}
.volume-control{display:flex;align-items:center;gap:12px}
.volume-control input{width:100%;accent-color:var(--cyan);height:5px}
.volume-control svg{width:19px;height:19px;color:var(--sub);flex:0 0 auto}
.audio-feature{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.025);margin:9px 0}
.audio-feature strong{display:block;font-size:13px}.audio-feature small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.45}
.sound-badge{font-size:10px;color:var(--cyan);letter-spacing:.12em;font-weight:800}
@media(hover:hover){.quick-card:hover,.playlist-card:hover,.settings-row:hover{border-color:rgba(155,140,255,.32);background:rgba(39,47,73,.92)}}



/* SONORA — Premium dark / restrained violet visual redesign
   Visual layer only: existing DOM hooks, IDs, classes and JavaScript are retained. */
:root{
 --bg:#09090c;--bg2:#111114;--elev:#17171c;--surface:#1d1d23;
 --line:rgba(255,255,255,.075);--text:#f5f4f8;--sub:#aaa7b2;
 --muted:#77737f;--disabled:#514d58;--violet:#873cff;--cyan:#a78bfa;
 --soft:#b78aff;--radius:17px;
 color-scheme:dark;
}
html,body{background:#09090c;color:var(--text)}
body{background:radial-gradient(ellipse at 50% -35%,rgba(116,54,210,.10),transparent 55%),#09090c}
body:before{display:none}
.app{background:transparent}
.topbar{padding-top:calc(17px + env(safe-area-inset-top,0px));padding-bottom:13px}
.brand-mark{background:var(--violet);color:#fff;box-shadow:none;border-radius:11px}

.1.1v3.4z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 18 6-6-6-6"/>'};return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.music}</svg>`;}
function artHTML(seed='',small=false){const track=seed&&typeof seed==='object'?seed:null;const key=track?(track.albumKey||track.album||track.id):seed;let h=0;for(const c of String(key||''))h=(h*31+c.charCodeAt(0))>>>0;const palettes=[['#6254B8','#247F93'],['#864D83','#304A8F'],['#267A82','#5545A3'],['#9A654B','#533E8F'],['#345A95','#773E76'],['#4D667C','#574E9E']];const p=palettes[h%palettes.length];const image=track?.coverDataUrl?`<img class="art-photo" src="${esc(track.coverDataUrl)}" alt="Sampul ${esc(tx(track))}" loading="lazy">`:icon('music',small?22:33);return `<div class="art ${small?'small':''} ${track?.coverDataUrl?'has-photo':''}" style="background:linear-gradient(135deg,${p[0]},${p[1]})">${image}</div>`;}
function cleanName(n){return String(n||'').replace(/^ss?stik\.io[_\-\s]*/i,'');}
function tx(t){return t?.title||t?.fileName?.replace(/\.[^.]+$/,'')||'Untitled Track';}

function openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;for(const s of STORE_NAMES)if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});};req.onsuccess=()=>{const db=req.result;db.onversionchange=()=>{db.close();log('Database version changed in another SONORA tab. Reopen this page.','warning');};resolve(db);};req.onerror=()=>reject(req.error);});}

async function readTags(file){const r={};const h=new Uint8Array(await file.slice(0,10).arrayBuffer());if(String.fromCharCode(h[0],h[1],h[2])!=='ID3'||h[3]<3)return r;
const ss=(b,o)=>(b[o]&127)<<21|(b[o+1]&127)<<14|(b[o+2]&127)<<7|(b[o+3]&127);const b=new Uint8Array(await file.slice(10,10+Math.min(ss(h,6),6e6)).arrayBuffer());

while(o+10<=b.length){const id=String.fromCharCode(b[o],b[o+1],b[o+2],b[o+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;

if(id==='TIT2')r.title=t();else if(id==='TPE1')r.artist=t();else if(id==='TALB')r.album=t();else if(id==='TCON')r.genre=t().replace(/^\(\d+\)/,'');
else if(id==='TYER'||id==='TDRC')r.year=t().slice(0,4);else if(id==='TRCK')r.trackNo=t().split('/')[0];
else if(id==='APIC'&&!r.coverDataUrl){let p=1;while(d[p])p++;const mt=dec(d.subarray(1,p),0)||'image/jpeg';p+=2;if(d[0]===1||d[0]===2){while(p<d.length&&!(d[p]===0&&d[p+1]===0))p+=2;p+=2;}else{while(d[p])p++;p++;}
const img=d.subarray(p);if(img.length>1000&&img.length<9e5)r.coverDataUrl=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>res('');f.readAsDataURL(new Blob([img],{type:mt.startsWith('image/')?mt:'image/jpeg'}));});}}

async function storeImportedFile(track,file,remaining,counter){
  try{
    const est=await navigator.storage?.estimate?.();
    if(est&&est.quota&&Number.isFinite(est.usage)&&file.size>(est.quota-est.usage)*0.95){
      const e=new Error('Ruang penyimpanan browser tidak cukup untuk file ini');e.name='QuotaExceededError';throw e;
    }
  }catch(e){if(e?.name==='QuotaExceededError')throw e;}
  try{
    await dbAddTrackAudioAndTemplates(track,file,remaining,counter);
  }catch(first){
    if(first?.name==='QuotaExceededError')throw first;
    log('Direct File store failed, retrying with a Blob copy: '+(first?.name||'')+' '+(first?.message||first),'warning');
    const buf=await file.arrayBuffer();
    const blob=new Blob([buf],{type:file.type||'application/octet-stream'});
    await dbAddTrackAudioAndTemplates(track,blob,remaining,counter);
  }
  const rec=await dbGet('audio',track.id);
  if(!rec||!rec.blob||rec.blob.size!==file.size){
    try{const t2=state.db.transaction(['tracks','audio'],'readwrite');t2.objectStore('tracks').delete(track.id);t2.objectStore('audio').delete(track.id);await txDone(t2);}catch{}
    throw new Error('Verifikasi penyimpanan gagal: audio tidak tersimpan utuh');
  }
}

function supportedVideoAudioMime(){
 if(!window.MediaRecorder)return '';
 const types=['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'];
 return types.find(t=>MediaRecorder.isTypeSupported(t))||'';
}
function chooseVideoAudioFile(file){

 const isVideo=(file.type||'').startsWith('video/')||/\.(mp4|mov|mkv|webm|avi)$/i.test(file.name||'');
 if(!isVideo){toast('Pilih berkas video yang valid.');return;}
 if(file.size>1024*1024*1024){toast('Ukuran video maksimal 1 GB untuk fitur ini.');return;}
 if(videoAudioObjectUrl)URL.revokeObjectURL(videoAudioObjectUrl);
 videoAudioFile=file;videoAudioResult=null;videoAudioObjectUrl=URL.createObjectURL(file);

}
function updateVideoAudioProgress(video){
 const wrap=$('#video-audio-progress-wrap'),label=$('#video-audio-progress-label'),bar=$('#video-audio-progress-bar'),status=$('#video-audio-status'),pct=$('#video-audio-percent');
 if(!wrap||!label||!bar||!status||!pct)return;
 const value=video.duration?Math.max(0,Math.min(100,video.currentTime/video.duration*100)):0;
 wrap.hidden=false;label.hidden=false;bar.style.width=value.toFixed(1)+'%';pct.textContent=Math.floor(value)+'%';status.textContent='Sedang mengekstrak audio…';
}
async function extractVideoAudio(){

 const video=$('#video-audio-preview');

 const mime=supportedVideoAudioMime();

 if(!window.MediaRecorder||!AudioCtx){toast('Browser ini belum mendukung ekstraksi audio. Gunakan Chrome versi terbaru.');return;}

 let destination=null,recorder=null,chunks=[];
 try{
  if(!Number.isFinite(video.duration)||video.duration===0){await new Promise((resolve,reject)=>{const ok=()=>{cleanup();resolve();};const bad=()=>{cleanup();reject(new Error('Video tidak dapat dibaca oleh browser.'));};const cleanup=()=>{video.removeEventListener('loadedmetadata',ok);video.removeEventListener('error',bad);};video.addEventListener('loadedmetadata',ok,{once:true});video.addEventListener('error',bad,{once:true});video.load();});}

   try{videoAudioSource?.disconnect();videoAudioMonitorGain?.disconnect();}catch{}

  toast('Audio berhasil diekstrak.');

ass="section">${section('Quick Access')}</div><div class="quick-grid"><button class="quick-card" data-act="open-page" data-page="favorites"><span class="quick-icon">${icon('heart')}</span><span><strong>Favorites</strong><small>${state.tracks.filter(x=>x.favorite).length} songs</small></span></button><button class="quick-card" data-act="open-page" data-page="albums"><span class="quick-icon">${icon('album')}</span><span><strong>Albums</strong><small>${albumGroups().length} albums</small></span></button><button class="quick-card" data-act="open-page" data-page="artists"><span class="quick-icon">${icon('artist')}</span><span><strong>Artists</strong><small>${artistGroups().length} artists</small></span></button><button class="quick-card" data-act="open-page" data-page="statistics"><span class="quick-icon">${icon('eq')}</span><span><strong>Statistics</strong><small>Your listening activity</small></span></button><button class="quick-card" data-act="open-page" data-page="trash"><span class="quick-icon">${icon('trash')}</span><span><strong>Recently Deleted</strong><small>Restore removed songs</small></span></button><button class="quick-card" data-act="open-page" data-page="recent"><span class="quick-icon">${icon('clock')}</span><span><strong>Recently Played</strong><small>Playback history</small></span></span></button></div><div class="section">${section('Your Library','Open','nav-library')}</div><div class="stats-grid"><div class="stat"><b>${state.tracks.length}</b><span>Total Songs</span></div><div class="stat"><b>${albumGroups().length}</b><span>Albums</span></div><div class="stat"><b>${artistGroups().length}</b><span>Artists</span></div><div class="stat"><b>${fmtTime(state.tracks.reduce((n,x)=>n+(x.duration||0),0))}</b><span>Library Duration</span></div></div>`;}
function dailyMix(){const tracks=[...state.tracks];if(tracks.length<5)return[];const seed=new Date().toISOString().slice(0,10)+':'+tracks.length;let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;const rand=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){x=(1664525*x+1013904223)>>>0;const j=x%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};const take=(arr,n)=>rand(arr).slice(0,n);const n=Math.min(25,tracks.length);const fav=tracks.filter(t=>t.favorite||t.playCount>0).sort((a,b)=>(b.playCount||0)-(a.playCount||0));const unplayed=tracks.filter(t=>!t.lastPlayedAt||Date.now()-t.lastPlayedAt>14*86400000);const selected=[];function add(arr,count){for(const t of take(arr,count))if(!selected.some(s=>s.id===t.id)&&selected.length<n)selected.push(t);}add(fav,Math.round(n*.5));add(unplayed,Math.round(n*.3));add(tracks,n-selected.length);return selected.slice(0,n);}

async function readImageData(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error||new Error('Gagal membaca gambar'));r.readAsDataURL(file);});}
async function coverToDataUrl(file){
  try{
    const url=URL.createObjectURL(file);
    try{
      const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('gambar tidak terbaca'));im.src=url;});
      const max=1024,w=img.naturalWidth,h=img.naturalHeight;
      if(!w||!h)throw new Error('ukuran gambar tidak terbaca');
      const sc=Math.min(1,max/Math.max(w,h));
      const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      const out=c.toDataURL('image/jpeg',0.88);
      if(out.startsWith('data:image/jpeg'))return out;
    }finally{URL.revokeObjectURL(url);}
  }catch(e){log('Cover resize fallback: '+e.message,'warning');}
  return await readImageData(file);
}

async function startList(ids,id,shuffle=false){

function msCoverArtwork(dataUrl){

function updateMsPosition(){

  if(!Number.isFinite(d)||d<=0)return;
  try{navigator.mediaSession.setPositionState({duration:d,playbackRate:audio.playbackRate||1,position:Math.max(0,Math.min(audio.currentTime||0,d))});}catch{}
}

function msSetHandlers(){
  if(msHandlersReady||!('mediaSession'in navigator))return;
  msHandlersReady=true;
  const ms=navigator.mediaSession;
  const set=(name,fn)=>{try{ms.setActionHandler(name,fn);}catch(e){log('Media action unsupported: '+name,'warning');}};
  set('play',()=>{if(audio.paused)return togglePlay();});
  set('pause',()=>{v12Pause();});
  set('stop',()=>{audio.pause();audio.currentTime=0;});
  set('previoustrack',()=>previousTrack());
  set('nexttrack',()=>nextTrack(false));
  set('seekto',d=>{
    if(!Number.isFinite(audio.duration))return;
    const pos=Math.max(0,Math.min(audio.duration,Number(d.seekTime)||0));
    if(d.fastSeek&&typeof audio.fastSeek==='function')audio.fastSeek(pos);else audio.currentTime=pos;
    state.currentTime=pos;state.lastClock=pos;updateMsPosition();

}
function setMediaSession(t){

    const ms=navigator.mediaSession,token=++msToken;
    const base={title:tx(t),artist:t.artist||'SONORA',album:t.album||'SONORA'};
    ms.metadata=new MediaMetadata({...base,artwork:msFallbackArtwork()});
    if(t.coverDataUrl){
      msCoverArtwork(t.coverDataUrl).then(art=>{
        if(art&&token===msToken&&state.currentId===t.id){try{ms.metadata=new MediaMetadata({...base,artwork:art});}catch{}}
      });
    }

  }catch(e){log('Media Session unavailable: '+e.message,'warning');}
}

function guessLang(raw){
  const text=String(raw||'').replace(/\[\d{1,2}:\d{2}(?:\.\d{1,3})?\]/g,' ').toLowerCase();
  const letters=(text.match(/\p{L}/gu)||[]).length;
  if(letters<30)return '';
  const nonLatin=(text.match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af\u0400-\u04ff\u0600-\u06ff]/g)||[]).length;
  if(nonLatin/letters>0.3)return 'intl';
  const words=text.match(/[a-z']+/g)||[];
  if(words.length<20)return '';
  const ID=new Set('yang dan aku kamu kau dia tak tidak ini itu di ke dari untuk dengan ada saat hanya cinta sayang rindu hati malam bila jika kita kami mereka pada akan bisa lagi sudah belum apa pernah selalu tapi namun oleh atau juga saja masih ingin tentang dalam bukan jangan harus mungkin semua setiap hari waktu dunia hidup kini karena sebuah seperti tanpa bersama pergi datang kembali'.split(' '));
  const EN=new Set("the and you i my me to of in is it that with for on be are love baby your we just don't but not all so can will like when what this have they there if no know oh yeah got get now one never come away down up out feel heart night time".split(' '));
  let a=0,b=0;
  for(const w of words){if(ID.has(w))a++;if(EN.has(w))b++;}
  const ra=a/words.length,rb=b/words.length;
  if(ra>=0.05&&ra>=rb*1.3)return 'id';
  if(rb>=0.05&&rb>=ra*1.3)return 'intl';
  return '';
}

async function handleImport(files){
  files=Array.from(files||[]);
  if(!files.length)return;
  if(state.importing){toast('Impor sebelumnya masih berjalan. Tunggu sampai selesai.');return;}
  const importLang=state.importLang||'';state.importLang='';
  if(!state.db){
    toast('Database belum siap. Coba muat ulang SONORA.');
    log('Import blocked: database is not ready.','error');
    return;
  }

  state.importing=true;
  showModal('Import Musik',`
    <p class="page-sub">Menambahkan audio ke koleksi lokal…</p>
    <div id="import-status" class="settings-list" style="margin-top:14px"></div>
    <div class="notice">Jangan tutup SONORA sampai proses impor selesai. Audio disimpan di browser/perangkat ini.</div>
  `);

  const results={imported:0,duplicates:0,skipped:0,failed:0,templated:0};
  const seen=new Set(state.tracks.map(t=>`${cleanName(t.fileName)}|${t.size}|${t.lastModified}`));
  const trashSeen=new Set(state.trash.map(t=>`${cleanName(t.fileName)}|${t.size}|${t.lastModified}`));
  const allowed=['mp3','m4a','mp4','aac','flac','ogg','oga','opus','wav','webm','aiff','aif','wma','amr','3gp','mid','midi','mka'];
  let templates=[];
  let titleCounter=0;
  try{titleCounter=Number(await setting('autoTitleCounter',0))||0;}catch(err){log('Could not read title counter: '+(err?.message||err),'warning');}

  try{
    templates=await uploadTemplates();
    if(!Array.isArray(templates))templates=[];
  }catch(err){
    log('Could not read upload templates: '+(err?.message||err),'warning');
    templates=[];
  }

  for(let i=0;i<files.length;i++){
    const file=files[i];
    const box=document.createElement('div');
    box.className='settings-row';
    box.innerHTML=`<span class="quick-icon">${icon('music')}</span><span class="copy"><strong>${esc(file.name||'Audio tanpa nama')}</strong><small id="imp-${i}">Menunggu…</small></span>`;
    $('#import-status')?.append(box);
    const status=$(`#imp-${i}`);

    try{
      if(!file || !file.size){
        results.skipped++;
        if(status)status.textContent='Dilewati · file kosong';
        continue;
      }

      if(status)status.textContent='Memeriksa file…';
      const fileName=cleanName(file.name||'audio')||'audio';
      const ext=(fileName.includes('.')?fileName.split('.').pop():'').toLowerCase();
      const mime=String(file.type||'').toLowerCase();
      const looksLikeAudio=mime.startsWith('audio/') || ['video/mp4','video/webm','video/3gpp','video/3gpp2','application/ogg','application/x-flac'].includes(mime) || allowed.includes(ext);
      if(!looksLikeAudio){
        results.skipped++;
        if(status)status.textContent='Dilewati · format bukan audio yang dikenali';
        continue;
      }

      const fingerprint=`${fileName}|${file.size}|${file.lastModified||0}`;
      if(seen.has(fingerprint)){
        results.duplicates++;
        if(status)status.textContent='Duplikat · dilewati';
        continue;
      }
      if(trashSeen.has(fingerprint)){
        results.duplicates++;
        if(status)status.textContent='Sudah ada di Baru Dihapus · pulihkan dari sana';
        continue;
      }

      if(status)status.textContent='Menyimpan audio…';
      const id=uid();
      const template=templates[0]||null;
      const nextNo=titleCounter+1;
      const title='Lagu '+nextNo;
      const track={
        id,title,artist:'',album:'',albumArtist:'',year:'',trackNo:'',discNo:'',
        genre:'',lang:importLang,duration:0,favorite:false,playCount:0,lastPlayedAt:0,
        addedAt:Date.now(),hasAudio:true,fileName,mime:mime||'application/octet-stream',
        size:file.size,lastModified:file.lastModified||0,deletedAt:0,
        ...(template?{coverDataUrl:template.coverDataUrl}:{})
      };
      try{const tg=await readTags(file);for(const k of ['title','artist','album','genre','year','trackNo'])if(tg[k])track[k]=tg[k];if(tg.coverDataUrl&&!template)track.coverDataUrl=tg.coverDataUrl;}catch(e){log('Tag read failed: '+(e?.message||e),'warning');}
      const remaining=template?templates.slice(1):templates;

      // Store the track, original File/Blob, and template queue atomically.
      await storeImportedFile(track,file,remaining,nextNo);
      titleCounter=nextNo;

      templates=remaining;
      seen.add(fingerprint);
      results.imported++;
      if(template)results.templated++;
      if(status)status.textContent=template?'Berhasil · template diterapkan':'Berhasil disimpan';
    }catch(err){
      results.failed++;
      const reason=err?.name==='QuotaExceededError'
        ?'Penyimpanan perangkat penuh'
        :err?.name==='DataCloneError'
          ?'Browser gagal membaca file audio'
        :err?.name==='NotReadableError'
          ?'File tidak dapat dibaca (izin hilang atau file dipindahkan)'
          :('Gagal menyimpan · '+(err?.message||err||'kesalahan tidak diketahui'));
      if(status)status.textContent=reason;
      log('Import failed: '+(file?.name||'unknown')+' · '+(err?.name||'Error')+' · '+(err?.message||err),'error');
      // Continue with the next file; one damaged/oversized file must not cancel the batch.
    }
  }

  state.importing=false;
  try{
    await refreshData();
  }catch(err){
    log('Library refresh after import failed: '+(err?.message||err),'error');
  }

  const summary=`
    <div class="stats-grid">
      <div class="stat"><b>${results.imported}</b><span>Berhasil</span></div>
      <div class="stat"><b>${results.templated}</b><span>Template dipakai</span></div>
      <div class="stat"><b>${results.skipped+results.duplicates}</b><span>Dilewati/Duplikat</span></div>
      <div class="stat"><b>${results.failed}</b><span>Gagal</span></div>
    </div>
    <div class="modal-actions">
      <button class="secondary" data-act="close-modal">Tutup</button>
      <button class="primary" data-act="go-library">Lihat Koleksi</button>
    </div>`;
  const modal=$('.modal');
  if(modal){
    const heading=modal.querySelector('.modal-head h2');
    if(heading)heading.textContent='Impor Selesai';
    const body=modal.querySelector('#import-status');
    body?.insertAdjacentHTML('afterend',summary);
    modal.querySelector('.notice')?.remove();
  }
  render();
}

function applyMasterVolume(value){
  const v=Math.max(0,Math.min(1,Number(value)));

async function restoreBackup(file){
 try{
  if(!file||!Number.isFinite(file.size)||file.size>150*1024*1024)throw new Error('Backup is larger than 150 MB or cannot be read.');
  const raw=await file.text();
  const obj=JSON.parse(raw);
  if(!obj||typeof obj!=='object'||obj.app!=='SONORA'||!Array.isArray(obj.tracks)||!Array.isArray(obj.playlists))throw new Error('This is not a valid SONORA metadata backup.');
  const collections={tracks:obj.tracks,playlists:obj.playlists,lyrics:obj.lyrics||[],history:obj.history||[],settings:obj.settings||[],links:obj.links||[]};
  const limits={tracks:20000,playlists:2000,lyrics:20000,history:50000,settings:500,links:10000};
  for(const [name,items] of Object.entries(collections)){
   if(!Array.isArray(items)||items.length>limits[name])throw new Error(`Backup contains an invalid ${name} collection.`);
   const ids=new Set();
   for(const item of items){
    if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.id!=='string'||!item.id.trim()||item.id.length>200)throw new Error(`Backup contains an invalid record in ${name}.`);
    if(ids.has(item.id))throw new Error(`Backup contains duplicate IDs in ${name}.`);
    ids.add(item.id);
   }
  }
  for(const playlist of collections.playlists){
   if(typeof playlist.name!=='string'||playlist.name.length>120||!Array.isArray(playlist.trackIds)||playlist.trackIds.some(id=>typeof id!=='string'))throw new Error('Backup contains an invalid playlist.');
  }
  for(const track of collections.tracks){
   if((track.title!==undefined&&typeof track.title!=='string')||(track.fileName!==undefined&&typeof track.fileName!=='string'))throw new Error('Backup contains invalid track metadata.');
   if(track.coverDataUrl!==undefined&&track.coverDataUrl!==null&&(!/^data:image\/(jpeg|png|webp|gif|avif|bmp);base64,/i.test(track.coverDataUrl)||track.coverDataUrl.length>12*1024*1024))throw new Error('Backup contains an invalid or oversized cover image.');
  }
  const existing=new Set((await dbGetAll('tracks')).map(t=>t.id));
  let added=0,conflicts=0;
  const tx=state.db.transaction(['tracks','playlists','lyrics','history','settings','links'],'readwrite');
  for(const t of collections.tracks){if(existing.has(t.id)){conflicts++;continue;}tx.objectStore('tracks').put({...t,hasAudio:false});added++;}
  for(const p of collections.playlists)tx.objectStore('playlists').put(p);
  for(const l of collections.lyrics)tx.objectStore('lyrics').put(l);
  for(const h of collections.history)tx.objectStore('history').put(h);
  for(const setting of collections.settings)tx.objectStore('settings').put(setting);
  for(const link of collections.links)tx.objectStore('links').put(link);
  await txDone(tx);
  await refreshData();
  toast(`Restore complete · ${added} added · ${conflicts} conflicts`);
  render();
 }catch(e){toast('Backup validation failed: '+(e.message||'Unknown error'));log('Backup restore failed: '+(e.stack||e.message),'error');}
}

async function v12PrepGhost(){v12.ghostReady=false;if(v12Xf()<=0||!v12.ghost||!state.currentId)return;const id=state.currentId;try{const rec=await dbGet('audio',id);if(!rec||!rec.blob||id!==state.currentId)return;if(v12.ghostUrl)URL.revokeObjectURL(v12.ghostUrl);v12.ghostUrl=URL.createObjectURL(rec.blob);const gh=v12.ghost;gh.onloadedmetadata=()=>{v12.ghostReady=true;};gh.src=v12.ghostUrl;gh.playbackRate=audio.playbackRate;try{gh.preservesPitch=audio.preservesPitch;}catch{}gh.load();}catch(e){log('V12 ghost: '+e.message,'warning');}}
function v12HasNext(){return state.queue.length>0&&(state.currentIndex+1<state.queue.length||state.repeat==='all');}
async function v12Cross(d){v12.xfBusy=true;const g=v12.g,gh=v12.ghost,c=state.audioCtx;try{gh.volume=audio.volume;gh.currentTime=Math.min(audio.currentTime+0.05,(gh.duration||1e9)-0.05);await gh.play();const t=c.currentTime;g.ghost.gain.cancelScheduledValues(t);g.ghost.gain.setValueAtTime(1,t);g.main.gain.cancelScheduledValues(t);g.main.gain.setValueAtTime(g.main.gain.value,t);g.main.gain.linearRampToValueAtTime(0,t+0.04);setTimeout(()=>{try{const t2=c.currentTime;g.ghost.gain.cancelScheduledValues(t2);g.ghost.gain.setValueAtTime(1,t2);g.ghost.gain.setValueCurveAtTime(v12Curve(false),t2,d);}catch{}setTimeout(()=>{try{gh.pause();}catch{}},d*1000+200);},60);v12.pendingIn=d;await nextTrack(true);}catch(e){v12.xfBusy=false;v12.pendingIn=0;try{g.main.gain.setValueAtTime(1,c.currentTime);}catch{}log('V12 crossfade gagal: '+e.message,'warning');}}
async function v12Pause(){const g=v12.g,d=Math.max(Math.min(v12.cfg.fade,2),.05);try{v12.ghost&&!v12.ghost.paused&&v12.ghost.pause();}catch{}if(g&&d>0&&state.playing&&state.audioCtx&&state.audioCtx.state==='running'){const t=state.audioCtx.currentTime;g.main.gain.cancelScheduledValues(t);g.main.gain.setValueAtTime(g.main.gain.value,t);g.main.gain.linearRampToValueAtTime(0,t+d);await v12Wait(d*1000+30);}audio.pause();}
audio.addEventListener('play',()=>{v12.fadingOut=false;v12VizLoop();if(state.audioCtx&&state.audioCtx.state!=='running')state.audioCtx.resume().catch(()=>{});const g=v12.g;if(!g||!state.audioCtx)return;try{const t=state.audioCtx.currentTime,gn=g.main.gain;gn.cancelScheduledValues(t);if(v12.pendingIn>0){const d=v12.pendingIn;v12.pendingIn=0;gn.setValueAtTime(0,t);gn.setValueCurveAtTime(v12Curve(true),t,d);}else if(v12.cfg.fade>0){gn.setValueAtTime(0,t);gn.linearRampToValueAtTime(1,t+Math.min(v12.cfg.fade,3));}else{gn.setValueAtTime(0,t);gn.linearRampToValueAtTime(1,t+.03);}}catch(e){log('V12 fade: '+e.message,'warning');}});
audio.addEventListener('pause',()=>{v12.lastPos=0;v12SavePos(audio.currentTime,audio.duration);});
audio.addEventListener('ended',()=>{if(state.currentId)delete v12.pos[state.currentId];});

function v12SavePos(p,d){const id=state.currentId;if(!v12.cfg.resume||!id||!Number.isFinite(d)||d<600)return;const n=Date.now();if(n-v12.lastPos<8000)return;v12.lastPos=n;v12.pos[id]=Math.floor(p);saveSetting('v12pos',v12.pos).catch(()=>{});}

async function v12Analyze(id){let t=getTrack(id);if(!t||(t.wave&&t.normGain)||t.analysisSkip)return;while(v12.analyzing)await v12Wait(300);t=getTrack(id);if(!t||(t.wave&&t.normGain)||t.analysisSkip)return;v12.analyzing=true;try{const rec=await dbGet('audio',id);if(!rec||!rec.blob||rec.blob.size>30*1048576||(t.duration||0)>900){t.analysisSkip=true;await dbPut('tracks',t);return;}const Ctx=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!Ctx)return;const ab=await new Ctx(1,1,22050).decodeAudioData(await rec.blob.arrayBuffer());const ch=[];for(let i=0;i<ab.numberOfChannels;i++)ch.push(ab.getChannelData(i));const n=ab.length,N=180,bins=new Array(N).fill(0),sz=Math.max(1,Math.floor(n/N)),blk=Math.floor(ab.sampleRate*.4);let peak=0,sumMs=0,cnt=0,bs=0,bc=0;for(let i=0;i<n;i++){let v=0;for(let k=0;k<ch.length;k++)v+=ch[k][i];v/=ch.length;const a=Math.abs(v);if(a>peak)peak=a;const b=Math.min(N-1,Math.floor(i/sz));if(a>bins[b])bins[b]=a;bs+=v*v;if(++bc>=blk){const ms=bs/bc;if(ms>1e-5){sumMs+=ms;cnt++;}bs=0;bc=0;}if(i%120000===119999)await v12Wait(0);}const rmsDb=10*Math.log10(cnt?sumMs/cnt:1e-4);let gain=Math.pow(10,(-16-rmsDb)/20);if(peak>0)gain=Math.min(gain,.97/peak);gain=Math.max(.3,Math.min(3,gain));const mx=Math.max(...bins)||1;t.normGain=+gain.toFixed(3);t.wave=bins.map(x=>Math.round(x/mx*100));await dbPut('tracks',t);}catch(e){const tt=getTrack(id);if(tt){tt.analysisSkip=true;dbPut('tracks',tt).catch(()=>{});}log('V12 analisis gagal: '+e.message,'warning');}finally{v12.analyzing=false;}}

function v12WaveHTML(){const t=activeTrack();const m=!t?'':t.wave?'Ketuk gelombang untuk loncat ke bagian lagu':t.analysisSkip?'Bentuk gelombang tidak tersedia untuk berkas ini':'Menganalisis bentuk gelombang…';return `<canvas id="v12-wave" class="v12-wave" aria-label="Bentuk gelombang lagu, ketuk untuk loncat"></canvas><p class="v12-cap">${m}</p>`;}
function v12VizHTML(){const on=v12.cfg.viz,m={bars:'Batang',wave:'Gelombang',circle:'Lingkaran'};return `<div class="v12-viz"><div class="v12-viz-head"><span class="eyebrow">VISUALIZER</span><span class="v12-chips"><button class="secondary" data-v12="viz-toggle">${on?'Matikan':'Aktifkan'}</button>${on?`<button class="secondary" data-v12="viz-mode">${m[v12.cfg.vizMode]||'Batang'}</button>`:''}</span></div>${on?'<canvas id="v12-viz" class="v12-viz-cv" aria-label="Visualizer audio"></canvas>':''}</div>`;}
function v12DrawWave(){const cv=$('#v12-wave');if(!cv)return;const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;if(!r.width)return;const W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);if(cv.width!==W)cv.width=W;if(cv.height!==H)cv.height=H;const x=cv.getContext('2d');x.clearRect(0,0,W,H);const cs=getComputedStyle(document.documentElement),on=cs.getPropertyValue('--violet').trim()||'#B6452C',off=cs.getPropertyValue('--muted').trim()||'#888',t=activeTrack();if(!t||!t.wave){x.fillStyle=off;x.globalAlpha=.4;x.fillRect(0,H/2-dpr,W,2*dpr);return;}const N=t.wave.length,bw=W/N,pr=state.duration?audio.currentTime/state.duration:0;for(let i=0;i<N;i++){const h=Math.max(2*dpr,t.wave[i]/100*H*.92);x.fillStyle=i/N<pr?on:off;x.globalAlpha=i/N<pr?1:.55;x.fillRect(i*bw+bw*.15,(H-h)/2,bw*.7,h);}}
function v12VizLoop(){cancelAnimationFrame(v12.raf);const draw=()=>{const cv=$('#v12-viz');if(!cv||!v12.cfg.viz||state.page!=='nowplaying')return false;const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,W=Math.round(r.width*dpr),H=Math.round(r.height*dpr);if(!W)return true;if(cv.width!==W)cv.width=W;if(cv.height!==H)cv.height=H;const x=cv.getContext('2d');x.clearRect(0,0,W,H);const col=getComputedStyle(document.documentElement).getPropertyValue('--violet').trim()||'#B6452C';x.fillStyle=col;x.strokeStyle=col;x.lineWidth=2*dpr;x.lineCap='round';const an=v12.g&&v12.g.an,f=new Uint8Array(an?an.frequencyBinCount:128),w=new Uint8Array(an?an.fftSize:256).fill(128);if(an&&state.playing){an.getByteFrequencyData(f);an.getByteTimeDomainData(w);}const m=v12.cfg.vizMode;if(m==='wave'){x.beginPath();for(let i=0;i<w.length;i++){const px=i/(w.length-1)*W,py=w[i]/255*H;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}else if(m==='circle'){const cx=W/2,cy=H/2,r0=Math.min(W,H)*.22,r1=Math.min(W,H)*.26,n=64;for(let i=0;i<n;i++){const v=f[i+1]/255,a=i/n*Math.PI*2-Math.PI/2,l=r0+Math.max(2*dpr,v*r1);x.beginPath();x.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);x.lineTo(cx+Math.cos(a)*l,cy+Math.sin(a)*l);x.stroke();}}else{const n=32,bw=W/n;for(let i=0;i<n;i++){const v=f[Math.floor(i*2.6)+1]/255,h=Math.max(3*dpr,v*H);x.fillRect(i*bw+bw*.15,H-h,bw*.7,h);}}return true;};const step=()=>{if(draw()===false)return;if(state.playing)v12.raf=requestAnimationFrame(step);};step();}
function v12AfterRender(){if(state.page!=='nowplaying')return;const t=activeTrack();if(t&&!t.wave&&!t.analysisSkip)v12Analyze(t.id).then(()=>{if(state.page!=='nowplaying'||activeTrack()?.id!==t.id)return;const c=$('.v12-cap'),a=activeTrack();if(c)c.textContent=a.wave?'Ketuk gelombang untuk loncat ke bagian lagu':'Bentuk gelombang tidak tersedia untuk berkas ini';v12DrawWave();v12Norm();});requestAnimationFrame(()=>{v12DrawWave();v12VizLoop();});}

function v12Page(){const c=v12.cfg,f=v12.fx;const sw=(k,t,d)=>`<div class="settings-row"><span class="copy"><strong>${t}</strong><small>${d}</small></span><button class="switch ${c[k]?'on':''}" data-v12="sw" data-key="${k}" aria-label="${t}"></button></div>`;const rg=(id,t,min,max,step,val,u)=>`<div class="range-row"><div class="range-head"><span>${t}</span><span id="v12-val-${id}">${val}${u}</span></div><input type="range" data-v12r="${id}" min="${min}" max="${max}" step="${step}" value="${val}" aria-label="${t}"></div>`;const done=state.tracks.filter(t=>t.wave&&t.normGain).length;return `<button class="text-link" data-act="nav" data-page="settings">${icon('back',15)} Pengaturan</button><p class="eyebrow" style="margin-top:10px">PEMUTARAN PRO</p><h1 class="page-title">Efek Audio Pro</h1><p class="page-sub">Transisi halus, normalisasi volume, visualizer, dan preset efek. Semua diproses di perangkat.</p><div class="muted-card"><strong>Transisi Lagu</strong><p>Crossfade menumpuk lagu saat berpindah. Fade mengecilkan suara di akhir dan menaikkannya di awal. Nilai 0 berarti mati.</p>${rg('cross','Crossfade',0,12,1,c.cross,' dtk')}${rg('fade','Fade in/out',0,12,1,c.fade,' dtk')}<div class="section settings-list">${sw('gapless','Sambung tanpa jeda','Lagu berikutnya disiapkan dan disambung dengan tumpang-tindih singkat (0,5 dtk) bila crossfade 0')}${sw('preload','Pra-muat lagu berikutnya','Menyiapkan lagu berikutnya di latar agar pindah lagu lebih cepat')}</div></div><div class="muted-card"><strong>Normalisasi Volume</strong><p>Menganalisis kekerasan tiap lagu lalu menyamakannya otomatis. Berkas asli tidak diubah. Lagu lebih dari 15 menit atau 30 MB dilewati.</p><div class="section settings-list">${sw('norm','Normalisasi volume per lagu','Terapkan penyesuaian volume otomatis')}</div><p class="hint">Sudah dianalisis: ${done} dari ${state.tracks.length} lagu</p><button class="secondary full" data-v12="analyze-all">${v12.allRun?'Sedang menganalisis…':'Analisis semua lagu'}</button></div><div class="muted-card"><strong>Preset Efek</strong><p>Kombinasi kecepatan, nada, reverb, dan bass tanpa mengedit berkas.</p><div class="v12-chips" style="flex-wrap:wrap">${Object.keys(V12P).map(k=>`<button class="secondary ${f.preset===k?'on':''}" data-v12="preset" data-k="${k}">${V12P[k].name}</button>`).join('')}</div>${rg('bass','Bass',0,12,1,f.bass||0,' dB')}${rg('reverb','Reverb',0,100,1,f.reverb||0,'%')}${rg('pan','Pan stereo',-100,100,5,f.pan||0,'')}<div class="section settings-list">${(()=>{const on=!!f.mono;return `<div class="settings-row"><span class="copy"><strong>Mono</strong><small>Gabungkan kiri dan kanan, berguna untuk satu earphone</small></span><button class="switch ${on?'on':''}" data-v12="mono" aria-label="Mono"></button></div>`;})()}</div><p class="hint">Pan: kiri −100, tengah 0, kanan +100. Preset Slowed dan Nightcore juga mengubah kecepatan dan nada.</p></div><div class="muted-card"><strong>Pemutaran Lagu Panjang</strong><div class="section settings-list">${sw('resume','Ingat posisi lagu panjang','Lagu lebih dari 10 menit dilanjutkan dari posisi terakhir')}</div></div><div class="muted-card"><strong>Kontrol Cepat</strong><p>Ketuk dua kali di sampul: sisi kiri −10 dtk, sisi kanan +10 dtk.<br>Keyboard: Spasi putar/jeda, ←/→ ±5 dtk, M bisukan, N berikutnya, P sebelumnya, L favorit, angka 0–9 loncat ke 0–90%.</p></div>`;}
function v12GuideGroup(){return ['Pemutaran Pro',[['Crossfade & Fade','Di Pengaturan → Efek Audio Pro. Crossfade menumpuk akhir lagu dengan awal lagu berikutnya (0–12 detik); fade mengecilkan/menaikkan suara di akhir, awal, jeda, dan lanjut. Butuh jalur audio Web Audio; bila perangkat tidak mendukung, pemutaran tetap normal tanpa efek.'],['Sambung Tanpa Jeda & Pra-muat','Lagu berikutnya disiapkan di latar. Dengan crossfade 0, SONORA memakai tumpang-tindih singkat 0,5 detik agar tidak ada jeda. Ini mendekati gapless, bukan gapless sempurna.'],['Normalisasi Volume','Menganalisis kekerasan lagu (RMS) dan menyimpan penguatan per lagu. Bisa dimatikan. Lagu sangat panjang dilewati demi hemat memori.'],['Visualizer','Di pemutar penuh, tekan Aktifkan di kartu Visualizer. Pilih bentuk Batang, Gelombang, atau Lingkaran. Bergerak mengikuti suara asli lewat AnalyserNode.'],['Preset Efek & Pan','Slowed + Reverb, Nightcore, Bass Boost, Mono, plus slider bass, reverb, dan pan stereo. Preset Normal mengembalikan semuanya.'],['Ingat Posisi Lagu Panjang','Lagu lebih dari 10 menit otomatis dilanjutkan dari posisi terakhir saat diputar lagi.'],['Sleep Timer: Fade-out & +10 Menit','Suara mengecil bertahap pada 30 detik terakhir. Saat timer aktif, tombol +10 menit muncul di halaman Sleep Timer.'],['Kontrol Cepat','Ketuk dua kali sampul di pemutar penuh: kiri −10 detik, kanan +10 detik. Keyboard: M bisukan, N/P berikutnya/sebelumnya, L favorit, angka 0–9 loncat ke 0–90%.'],['Waveform di Seekbar','Bentuk gelombang lagu di atas seekbar pemutar penuh; ketuk untuk loncat. Hasil analisis disimpan di data lagu (lagu lebih dari 15 menit tidak dianalisis).']]];}

const v12c={cut:null,pv:null,merge:{ids:[],xf:0},rec:null,sync:null,lrc:null,kar:null,busy:false};
const V12C_SR=44100,V12C_MAXTRK=600,V12C_MAXTOT=1200,V12C_MAXMB=60;

function v12T1(s){const ds=Math.max(0,Math.round((s||0)*10)),m=Math.floor(ds/600),sc=Math.floor((ds%600)/10);return m+':'+String(sc).padStart(2,'0')+','+(ds%10);}
function v12Lrc(t){const cs=Math.max(0,Math.round(t*100)),m=Math.floor(cs/6000),s=Math.floor((cs%6000)/100),c=cs%100;return '['+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')+']';}
function v12Key(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,'');}
const v12BgC=new Map();
function v12Bg(k){let s=v12BgC.get(k);if(!s){s=new Set();for(let i=0;i<k.length-1;i++)s.add(k.slice(i,i+2));if(v12BgC.size>5000)v12BgC.clear();v12BgC.set(k,s);}return s;}
function v12Dice(a,b){if(a.length<2||b.length<2)return 0;const x=v12Bg(a),y=v12Bg(b);let n=0;for(const g of x)if(y.has(g))n++;return 2*n/(x.size+y.size);}

function v12Wav(chunks,frames,sr){const h=new DataView(new ArrayBuffer(44)),dl=frames*4,w=(o,s)=>{for(let i=0;i<s.length;i++)h.setUint8(o+i,s.charCodeAt(i));};w(0,'RIFF');h.setUint32(4,36+dl,true);w(8,'WAVE');w(12,'fmt ');h.setUint32(16,16,true);h.setUint16(20,1,true);h.setUint16(22,2,true);h.setUint32(24,sr,true);h.setUint32(28,sr*4,true);h.setUint16(32,4,true);h.setUint16(34,16,true);w(36,'data');h.setUint32(40,dl,true);return new Blob([h.buffer,...chunks],{type:'audio/wav'});}

async function v12SaveTrack(blob,m){const id=uid(),ext=m.ext||'wav',title=m.title||'Tanpa judul';const track={id,title,artist:m.artist||'',album:m.album||'',albumArtist:'',year:'',trackNo:'',discNo:'',genre:m.genre||'',lang:m.lang||'',duration:m.dur||0,favorite:false,playCount:0,lastPlayedAt:0,addedAt:Date.now(),hasAudio:true,fileName:title.replace(/[\\/:*?"<>|]+/g,'_')+'.'+ext,mime:blob.type||'audio/wav',size:blob.size,lastModified:Date.now(),deletedAt:0,...(m.cover?{coverDataUrl:m.cover}:{})};const t=state.db.transaction(['tracks','audio'],'readwrite');t.objectStore('tracks').add(track);t.objectStore('audio').add({id,blob});await txDone(t);const rec=await dbGet('audio',id);if(!rec||!rec.blob||rec.blob.size!==blob.size){try{const t2=state.db.transaction(['tracks','audio'],'readwrite');t2.objectStore('tracks').delete(id);t2.objectStore('audio').delete(id);await txDone(t2);}catch{}throw new Error('Verifikasi penyimpanan gagal');}await refreshData();return id;}

async function v12CutOpen(id){const t=getTrack(id);if(!t)return;if(v12c.busy){toast('Tunggu proses sebelumnya selesai.');return;}const rec=await dbGet('audio',id);if(!rec||!rec.blob){toast('Audio lagu ini tidak ditemukan.');return;}if(rec.blob.size>V12C_MAXMB*1048576||(t.duration||0)>V12C_MAXTRK+5){toast('Lagu terlalu panjang untuk dipotong (maksimal 10 menit).');return;}if(state.playing)await v12Pause();showModal('Pemotong Audio','<p class="hint">Membaca dan menganalisis audio…</p>');let ab;try{ab=await v12Decode(rec.blob);}catch(e){closeModal();toast('Audio ini tidak bisa dibaca untuk dipotong.');log('Pemotong: decode gagal: '+(e&&e.message),'warning');return;}if(ab.duration>V12C_MAXTRK+5){closeModal();toast('Lagu terlalu panjang untuk dipotong (maksimal 10 menit).');return;}const N=300,L=ab.getChannelData(0),sz=Math.max(1,Math.floor(ab.length/N)),pk=new Array(N).fill(0);for(let i=0;i<ab.length;i++){const b=Math.min(N-1,(i/sz)|0),a=Math.abs(L[i]);if(a>pk[b])pk[b]=a;}const mx=Math.max(...pk)||1;v12c.cut={id,buf:ab,pk:pk.map(x=>x/mx),s:0,e:ab.duration,dur:ab.duration,pos:-1};showModal('Pemotong Audio',v12CutHTML(t));v12CutBind();requestAnimationFrame(v12CutDraw);}
function v12CutHTML(t){const adj=w=>[-1,-.1,.1,1].map(d=>`<button class="secondary" data-v12="b3-cut-adj" data-w="${w}" data-d="${d}">${d>0?'+':'−'}${String(Math.abs(d)).replace('.',',')}</button>`).join('');return `<p class="hint">${esc(tx(t))}</p><canvas id="v12c-cv" class="v12-cutcv" aria-label="Gelombang untuk memilih bagian yang dipotong"></canvas><p class="hint">Seret penanda pada gelombang untuk memilih awal dan akhir.</p><div class="v12-cuttimes"><span>Awal <b id="v12c-s"></b></span><span>Akhir <b id="v12c-e"></b></span><span>Panjang <b id="v12c-d"></b></span></div><div class="v12-adj"><span class="v12-cap-l">Awal</span>${adj('s')}</div><div class="v12-adj"><span class="v12-cap-l">Akhir</span>${adj('e')}</div><div class="form-group"><label>Nama potongan</label><input class="field" id="v12c-name" maxlength="80" value="${esc(tx(t)+' (potongan)')}"></div><div class="modal-actions"><button class="secondary" data-v12="b3-cut-play" id="v12c-pv">Pratinjau</button><button class="primary" data-v12="b3-cut-save">Simpan ke Koleksi</button></div>`;}
function v12CutDraw(){const c=v12c.cut,cv=$('#v12c-cv');if(!c||!cv)return;const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;if(!w)return;if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);const N=c.pk.length,bw=w/N,xs=c.s/c.dur*w,xe=c.e/c.dur*w,acc=v12Col('--violet'),mut=v12Col('--muted'),tx0=v12Col('--text');for(let i=0;i<N;i++){const x=i*bw,inside=x+bw>xs&&x<xe,bh=Math.max(2,c.pk[i]*(h-12));g.globalAlpha=inside?1:.35;g.fillStyle=inside?acc:mut;g.fillRect(x,(h-bh)/2,Math.max(1,bw-1),bh);}g.globalAlpha=1;g.fillStyle=tx0;g.fillRect(xs-1.5,0,3,h);g.fillRect(xe-1.5,0,3,h);g.beginPath();g.arc(xs,8,6,0,7);g.arc(xe,h-8,6,0,7);g.fill();if(c.pos>=0){const xp=c.pos/c.dur*w;g.fillStyle=tx0;g.globalAlpha=.7;g.fillRect(xp-1,0,2,h);g.globalAlpha=1;}const s=$('#v12c-s'),e=$('#v12c-e'),d=$('#v12c-d');if(s)s.textContent=v12T1(c.s);if(e)e.textContent=v12T1(c.e);if(d)d.textContent=v12T1(c.e-c.s);}
function v12CutSet(w,x){const c=v12c.cut;if(!c)return;const g=Math.min(.5,c.dur/2);if(w==='s')c.s=Math.max(0,Math.min(x,c.e-g));else c.e=Math.min(c.dur,Math.max(x,c.s+g));v12CutStop();v12CutDraw();}
function v12CutBind(){const cv=$('#v12c-cv');if(!cv)return;let w=null;const at=e=>{const r=cv.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*v12c.cut.dur;};cv.addEventListener('pointerdown',e=>{const c=v12c.cut;if(!c)return;const x=at(e);w=Math.abs(x-c.s)<=Math.abs(x-c.e)?'s':'e';try{cv.setPointerCapture(e.pointerId);}catch{}v12CutSet(w,x);e.preventDefault();});cv.addEventListener('pointermove',e=>{if(w&&v12c.cut)v12CutSet(w,at(e));});const up=()=>{w=null;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);}
function v12CutStop(){const p=v12c.pv;v12c.pv=null;if(!p)return;cancelAnimationFrame(p.raf);try{p.src.onended=null;p.src.stop();}catch{}try{p.ctx.close();}catch{}if(v12c.cut)v12c.cut.pos=-1;const b=$('#v12c-pv');if(b)b.textContent='Pratinjau';v12CutDraw();}
function v12CutPlay(){if(v12c.pv){v12CutStop();return;}const c=v12c.cut;if(!c)return;const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx){toast('Pratinjau tidak didukung di perangkat ini.');return;}try{const ctx=new Ctx(),src=ctx.createBufferSource(),gn=ctx.createGain();if(ctx.resume)ctx.resume();src.buffer=c.buf;gn.gain.value=Math.max(.05,state.masterVolume||.8);src.connect(gn);gn.connect(ctx.destination);const t0=ctx.currentTime,p={ctx,src,raf:0};v12c.pv=p;src.onended=()=>{if(v12c.pv===p)v12CutStop();};src.start(0,c.s,c.e-c.s);const tick=()=>{if(v12c.pv!==p||!v12c.cut)return;c.pos=c.s+(ctx.currentTime-t0);v12CutDraw();p.raf=requestAnimationFrame(tick);};tick();const b=$('#v12c-pv');if(b)b.textContent='Hentikan';}catch(e){toast('Pratinjau gagal: '+(e&&e.message));}}
async function v12CutSave(b){const c=v12c.cut,t=c&&getTrack(c.id);if(!c||!t||v12c.busy)return;v12CutStop();const name=String($('#v12c-name')&&$('#v12c-name').value||'').trim().slice(0,80)||tx(t)+' (potongan)';v12c.busy=true;if(b){b.disabled=true;b.textContent='Menyimpan…';}try{const sr=c.buf.sampleRate,a=Math.floor(c.s*sr),z=Math.min(c.buf.length,Math.ceil(c.e*sr)),L=c.buf.getChannelData(0),R=c.buf.numberOfChannels>1?c.buf.getChannelData(1):L,chunks=[],B=262144,fd=Math.max(1,Math.min(Math.floor(sr*.008),Math.floor((z-a)/2)));for(let p=a;p<z;p+=B){const q=Math.min(z,p+B),pcm=v12Pcm(L,R,p,q);for(let j=0;p+j<a+fd&&j<q-p;j++){const f=(p+j-a)/fd;pcm[2*j]*=f;pcm[2*j+1]*=f;}for(let j=Math.max(0,z-fd-p);j<q-p;j++){const f=(z-1-(p+j))/fd;pcm[2*j]*=f;pcm[2*j+1]*=f;}chunks.push(pcm);await v12Wait(0);}const frames=z-a,blob=v12Wav(chunks,frames,sr);await v12SaveTrack(blob,{title:name,artist:t.artist,album:t.album,genre:t.genre,lang:t.lang,cover:t.coverDataUrl,dur:frames/sr});v12c.cut=null;closeModal();render();toast('Potongan disimpan ke koleksi.');}catch(e){toast(v12SaveErr(e));if(b){b.disabled=false;b.textContent='Simpan ke Koleksi';}log('Pemotong: '+(e&&e.message),'error');}finally{v12c.busy=false;}}

/* --- gabung lagu --- */
async function v12MixRun(n,get,xfN,prog){const chunks=[],B=262144;let frames=0,tail=null;const push=(L,R,a,b)=>{for(let p=a;p<b;p+=B)chunks.push(v12Pcm(L,R,p,Math.min(b,p+B)));frames+=Math.max(0,b-a);};for(let i=0;i<n;i++){if(prog)prog(i);const {L,R,len}=await get(i),last=i===n-1;let n0=0;if(tail){const tl=tail.L.length;n0=Math.min(tl,Math.floor(len/2),xfN);if(tl>n0)push(tail.L,tail.R,0,tl-n0);if(n0>0){const mL=new Float32Array(n0),mR=new Float32Array(n0);for(let k=0;k<n0;k++){const x=(k+.5)/n0*Math.PI/2,go=Math.cos(x),gi=Math.sin(x);mL[k]=tail.L[tl-n0+k]*go+L[k]*gi;mR[k]=tail.R[tl-n0+k]*go+R[k]*gi;}push(mL,mR,0,n0);}}const keep=(last||xfN<=0)?0:Math.min(xfN,Math.floor((len-n0)/2));push(L,R,n0,len-keep);tail=keep>0?{L:L.slice(len-keep),R:R.slice(len-keep)}:null;await v12Wait(0);}return{chunks,frames};}
function v12MergeOpen(){v12c.merge={ids:[],xf:0};showModal('Gabung Lagu',`<p class="hint">Ketuk lagu untuk menambahkannya ke urutan. Hasil disimpan sebagai lagu WAV baru.</p><input class="field" id="v12m-q" placeholder="Cari lagu…" autocomplete="off"><div id="v12m-list" class="v12-pickbox settings-list"></div><div class="v12-h">Urutan gabungan</div><div id="v12m-sel"></div><div class="range-row"><div class="range-head"><span>Crossfade</span><span id="v12m-xfv">0 dtk</span></div><input type="range" id="v12m-xf" min="0" max="10" step="1" value="0" aria-label="Crossfade gabungan"></div><div class="form-group"><label>Nama hasil gabungan</label><input class="field" id="v12m-name" maxlength="80" value="Gabungan"></div><div class="modal-actions"><button class="secondary" data-act="close-modal">Batal</button><button class="primary" id="v12m-go" data-v12="b3-merge-go">Gabungkan</button></div>`);v12MergeRender();}
function v12MergeRender(){const l=$('#v12m-list'),s=$('#v12m-sel');if(!l||!s)return;const r=v12Find($('#v12m-q')?$('#v12m-q').value:'',40);l.innerHTML=r.items.map(t=>`<button class="settings-row" data-v12="b3-merge-add" data-id="${esc(t.id)}"><span class="copy"><strong>${esc(tx(t))}</strong><small>${esc(artist(t))} · ${fmtTime(t.duration)}</small></span>${icon('plus')}</button>`).join('')||'<p class="hint">Tidak ada lagu yang cocok.</p>';if(r.total>r.items.length)l.insertAdjacentHTML('beforeend',`<p class="hint">Menampilkan 40 dari ${r.total} lagu. Persempit dengan kata kunci.</p>`);const ids=v12c.merge.ids.filter(id=>getTrack(id));v12c.merge.ids=ids;const tot=ids.reduce((n,id)=>n+(getTrack(id).duration||0),0);s.innerHTML=ids.length?ids.map((id,i)=>{const t=getTrack(id);return `<div class="v12-ro"><span class="v12-ro-t"><strong>${i+1}. ${esc(tx(t))}</strong><small>${esc(artist(t))} · ${fmtTime(t.duration)}</small></span><span style="margin-left:auto;display:flex;gap:2px"><button class="row-icon" data-v12="b3-merge-up" data-i="${i}" aria-label="Naikkan urutan">↑</button><button class="row-icon" data-v12="b3-merge-dn" data-i="${i}" aria-label="Turunkan urutan">↓</button><button class="row-icon" data-v12="b3-merge-rm" data-i="${i}" aria-label="Hapus dari gabungan">${icon('close',17)}</button></span></div>`;}).join('')+`<p class="hint">Total ${fmtTime(tot)} · perkiraan ${Math.round(tot*.0106*10)/10} MB${tot>V12C_MAXTOT?' · melebihi batas 20 menit':''}</p>`:'<p class="hint">Belum ada lagu dipilih. Pilih minimal dua lagu.</p>';}
async function v12MergeGo(b){const m=v12c.merge,ids=m.ids.filter(id=>getTrack(id));if(ids.length<2){toast('Pilih minimal dua lagu.');return;}if(v12c.busy){toast('Tunggu proses sebelumnya selesai.');return;}const est=ids.reduce((n,id)=>n+(getTrack(id).duration||0),0);if(est>V12C_MAXTOT){toast('Total melebihi 20 menit. Kurangi lagu.');return;}const name=String($('#v12m-name')&&$('#v12m-name').value||'').trim().slice(0,80)||'Gabungan';v12c.busy=true;b.disabled=true;if(state.playing)await v12Pause();let acc=0;try{const out=await v12MixRun(ids.length,async i=>{const t=getTrack(ids[i]),rec=await dbGet('audio',ids[i]);if(!rec||!rec.blob)throw new Error('Audio "'+tx(t)+'" tidak ditemukan');if(rec.blob.size>V12C_MAXMB*1048576)throw new Error('"'+tx(t)+'" terlalu besar untuk digabung');const ab=await v12Decode(rec.blob);if(ab.duration>V12C_MAXTRK+5)throw new Error('"'+tx(t)+'" lebih dari 10 menit');acc+=ab.duration;if(acc>V12C_MAXTOT+10)throw new Error('Total melebihi 20 menit');const L=ab.getChannelData(0);return{L,R:ab.numberOfChannels>1?ab.getChannelData(1):L,len:ab.length};},Math.round(m.xf*V12C_SR),i=>{b.textContent='Menggabungkan '+(i+1)+'/'+ids.length+'…';});const blob=v12Wav(out.chunks,out.frames,V12C_SR),first=getTrack(ids[0]);await v12SaveTrack(blob,{title:name,artist:first.artist,cover:(ids.map(getTrack).find(x=>x&&x.coverDataUrl)||{}).coverDataUrl,dur:out.frames/V12C_SR});closeModal();render();toast('Gabungan disimpan ke koleksi.');}catch(e){toast('Gabung gagal: '+(e&&e.message||e));b.disabled=false;b.textContent='Gabungkan';log('Gabung: '+(e&&e.message),'error');}finally{v12c.busy=false;}}

/* --- perekam suara --- */
function v12RecIdle(){return `<p class="hint">Rekam suara dari mikrofon dan simpan sebagai lagu. Maksimal 10 menit. Musik yang sedang diputar akan dijeda.</p><div class="v12-rec-time" id="v12r-t">0:00</div><div class="modal-actions"><button class="secondary" data-act="close-modal">Batal</button><button class="primary" data-v12="b3-rec-start">Mulai Merekam</button></div>`;}
function v12RecOpen(){showModal('Perekam Suara',`<div id="v12r-box">${v12RecIdle()}</div>`);}
async function v12RecStart(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){toast('Perekam suara tidak didukung di perangkat ini.');return;}try{if(state.playing)await v12Pause();const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';const mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);const r={mr,stream,chunks:[],t0:Date.now(),mime:mr.mimeType||mt||'audio/webm',timer:0,blob:null,cancel:false,dur:0};v12c.rec=r;mr.ondataavailable=e=>{if(e.data&&e.data.size)r.chunks.push(e.data);};mr.onstop=()=>{clearInterval(r.timer);r.stream.getTracks().forEach(x=>x.stop());if(r.cancel)return;r.blob=new Blob(r.chunks,{type:r.mime});r.dur=(Date.now()-r.t0)/1000;const box=$('#v12r-box');if(box)box.innerHTML=`<p class="hint">Rekaman selesai: ${fmtTime(r.dur)}.</p><div class="form-group"><label>Nama rekaman</label><input class="field" id="v12r-name" maxlength="80" value="${esc('Rekaman '+new Date().toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}"></div><div class="modal-actions"><button class="secondary" data-v12="b3-rec-discard">Buang</button><button class="primary" data-v12="b3-rec-save">Simpan ke Koleksi</button></div>`;};mr.start(1000);r.timer=setInterval(()=>{const s=(Date.now()-r.t0)/1000,el=$('#v12r-t');if(el)el.textContent=fmtTime(s);if(s>=600)v12RecStop();},500);const box=$('#v12r-box');if(box)box.innerHTML=`<p class="hint">Sedang merekam…</p><div class="v12-rec-time" id="v12r-t">0:00</div><div class="modal-actions"><button class="primary" data-v12="b3-rec-stop">Berhenti</button></div>`;}catch(e){toast(e&&e.name==='NotAllowedError'?'Izin mikrofon ditolak. Izinkan mikrofon untuk SONORA di pengaturan browser.':'Tidak bisa memulai rekaman: '+(e&&e.message||e));}}
function v12RecStop(){const r=v12c.rec;if(r&&r.mr&&r.mr.state!=='inactive')try{r.mr.stop();}catch{}}
function v12RecCancel(){const r=v12c.rec;if(!r)return;r.cancel=true;clearInterval(r.timer);try{if(r.mr.state!=='inactive')r.mr.stop();}catch{}try{r.stream.getTracks().forEach(x=>x.stop());}catch{}v12c.rec=null;}
async function v12RecSave(b){const r=v12c.rec;if(!r||!r.blob||v12c.busy)return;const name=String($('#v12r-name')&&$('#v12r-name').value||'').trim().slice(0,80)||'Rekaman suara';v12c.busy=true;b.disabled=true;b.textContent='Menyimpan…';try{let blob=r.blob,dur=r.dur,ext='webm';try{const ab=await v12Decode(r.blob),L=ab.getChannelData(0),R=ab.numberOfChannels>1?ab.getChannelData(1):L,chunks=[],B=262144;for(let p=0;p<ab.length;p+=B){chunks.push(v12Pcm(L,R,p,Math.min(ab.length,p+B)));await v12Wait(0);}blob=v12Wav(chunks,ab.length,ab.sampleRate);dur=ab.duration;ext='wav';}catch(e){log('Rekaman: konversi WAV gagal, memakai berkas asli: '+(e&&e.message),'warning');ext=r.mime.includes('mp4')?'m4a':r.mime.includes('ogg')?'ogg':'webm';}await v12SaveTrack(blob,{title:name,dur,ext});v12c.rec=null;closeModal();render();toast('Rekaman disimpan ke koleksi.');}catch(e){toast(v12SaveErr(e));b.disabled=false;b.textContent='Simpan ke Koleksi';}finally{v12c.busy=false;}}

/* --- editor sinkron lirik --- */
async function v12SyncOpen(id){const t=getTrack(id);if(!t||!t.hasAudio){toast('Lagu ini belum punya audio.');return;}const lyr=await dbGet('lyrics',id);let text='';if(lyr&&lyr.text)text=lyr.type==='lrc'?parseLRC(lyr.text).map(x=>x.text).join('\n'):lyr.text;v12c.sync={id,lines:[],times:[],idx:0};showModal('Sinkron Lirik',`<div id="v12s-box"><p class="hint">${esc(tx(t))}</p><div class="form-group"><label>Teks lirik (satu baris per kalimat)</label><textarea class="field" id="v12s-text" rows="9" placeholder="Tempel lirik di sini…">${esc(text)}</textarea></div><p class="hint">Setelah mulai, ketuk tombol besar tepat saat baris yang tampil dinyanyikan. Waktu ditandai 0,2 detik lebih awal untuk mengimbangi jeda ketukan.</p><div class="modal-actions"><button class="secondary" data-act="close-modal">Batal</button><button class="primary" data-v12="b3-sync-go">Mulai</button></div></div>`);}
async function v12SyncGo(){const s=v12c.sync;if(!s)return;const lines=String($('#v12s-text')&&$('#v12s-text').value||'').split(/\r?\n/).map(x=>x.replace(/\[\d{1,2}:\d{2}(?:[.:]\d{1,3})?\]/g,'').trim()).filter(Boolean).slice(0,400);if(!lines.length){toast('Tulis atau tempel lirik terlebih dahulu.');return;}s.lines=lines;s.times=[];s.idx=0;if(state.currentId!==s.id)await startList([s.id],s.id);else if(!state.playing){try{await togglePlay();}catch{}}v12SyncDraw();}
function v12SyncDraw(){const s=v12c.sync,box=$('#v12s-box');if(!s||!box)return;if(s.idx>=s.lines.length){v12SyncReview();return;}box.innerHTML=`<div class="v12-sync"><div class="v12-sync-n">Baris ${s.idx+1} dari ${s.lines.length}</div><div class="v12-sync-prev">${esc(s.lines[s.idx-1]||'')}</div><div class="v12-sync-cur">${esc(s.lines[s.idx])}</div><div class="v12-sync-next">${esc(s.lines[s.idx+1]||'')}</div><button class="primary v12-tap" data-v12="b3-sync-tap">Ketuk</button><div class="v12-chips" style="justify-content:center;flex-wrap:wrap"><button class="secondary" data-v12="b3-sync-back">Mundur 5 dtk</button><button class="secondary" data-v12="b3-sync-play">Putar/Jeda</button><button class="secondary" data-v12="b3-sync-undo">Urungkan</button>${s.idx>0?'<button class="secondary" data-v12="b3-sync-finish">Selesai sekarang</button>':''}</div></div>`;}
function v12SyncBuild(){const s=v12c.sync;return s.times.map((t,i)=>v12Lrc(t)+s.lines[i]).join('\n');}
function v12SyncReview(){const s=v12c.sync,box=$('#v12s-box');if(!s||!box)return;if(!s.times.length){toast('Belum ada baris yang ditandai.');v12SyncDraw();return;}box.innerHTML=`<p class="hint">Periksa hasilnya. Kamu bisa menggeser semua waktu atau mengedit teks LRC langsung.</p><textarea class="field" id="v12s-lrc" rows="12" spellcheck="false">${esc(v12SyncBuild())}</textarea><div class="v12-chips" style="margin:10px 0"><button class="secondary" data-v12="b3-sync-shift" data-d="-0.5">Geser −0,5 dtk</button><button class="secondary" data-v12="b3-sync-shift" data-d="0.5">Geser +0,5 dtk</button></div><div class="modal-actions"><button class="secondary" data-v12="b3-sync-restart">Ulangi</button><button class="primary" data-v12="b3-sync-save">Simpan Lirik</button></div>`;}
async function v12SyncSave(){const s=v12c.sync,el=$('#v12s-lrc');if(!s||!el)return;const text=el.value.trim();if(!parseLRC(text).length){toast('Format LRC tidak valid. Contoh: [00:12.50]Baris lirik');return;}await dbPut('lyrics',{id:s.id,type:'lrc',text,updatedAt:Date.now()});state.lyricsId=s.id;v12c.sync=null;closeModal();render();toast('Lirik bersinkron tersimpan.');}

/* --- impor lirik massal --- */
function v12LrcPick(){if(!v12c.lrcInput){const i=document.createElement('input');i.type='file';i.multiple=true;i.accept='.lrc,.txt,text/plain';i.hidden=true;i.addEventListener('change',()=>{const f=Array.from(i.files||[]);i.value='';if(f.length)v12LrcMatch(f);});document.body.append(i);v12c.lrcInput=i;}v12c.lrcInput.click();}
async function v12LrcMatch(files){showModal('Impor Lirik Massal','<p class="hint">Membaca dan mencocokkan berkas…</p>');const tr=state.tracks.filter(t=>t.hasAudio).map(t=>{const fn=String(t.fileName||'').replace(/\.[^.]+$/,'').replace(/^ssstik\.io_/i,'');return{id:t.id,keys:[...new Set([v12Key(t.title),v12Key(fn),v12Key(artist(t)+tx(t)),v12Key(tx(t)+artist(t))].filter(Boolean))]};});const items=[];let k=0;for(const f of files.slice(0,500)){let text='';try{text=(await f.text()).replace(/^\uFEFF/,'').trim();}catch{}const base=f.name.replace(/\.[^.]+$/,'').replace(/^ssstik\.io_/i,'').replace(/\b(lyrics?|lirik)\b/gi,'');const fk=[...new Set([v12Key(base),...base.split(/\s[-–—_]\s/).map(v12Key)].filter(Boolean))];let best=null,bs=0;if(text&&fk.length)for(const t of tr){let sc=0;for(const a of fk)for(const b of t.keys){const x=v12Score(a,b);if(x>sc)sc=x;}if(sc>bs){bs=sc;best=t.id;}}items.push({name:f.name,text,id:bs>=.8?best:null,score:bs,on:bs>=.8});if(++k%15===0)await v12Wait(0);}const used=new Map();items.forEach((it,i)=>{if(!it.id)return;const u=used.get(it.id);if(u===undefined)used.set(it.id,i);else if(items[u].score>=it.score){it.id=null;it.on=false;}else{items[u].id=null;items[u].on=false;used.set(it.id,i);}});v12c.lrc={items,over:false};v12LrcShow();}
function v12LrcShow(){const L=v12c.lrc;if(!L)return;const ok=L.items.map((it,i)=>[it,i]).filter(([it])=>it.id),no=L.items.filter(it=>!it.id);showModal('Impor Lirik Massal',`<p class="hint">${ok.length} dari ${L.items.length} berkas cocok dengan lagu. Hapus centang untuk melewati.</p><div class="settings-row"><span class="copy"><strong>Timpa lirik yang sudah ada</strong><small>Jika mati, lagu yang sudah punya lirik dilewati</small></span><button class="switch ${L.over?'on':''}" data-v12="b3-lrc-over" aria-label="Timpa lirik yang sudah ada"></button></div><div class="v12-pickbox settings-list">${ok.map(([it,i])=>`<button class="settings-row" data-v12="b3-lrc-tog" data-i="${i}"><span class="copy"><strong>${it.on?'☑':'☐'} ${esc(it.name)}</strong><small>→ ${esc(tx(getTrack(it.id)))} · kecocokan ${Math.round(it.score*100)}%</small></span></button>`).join('')||'<p class="hint">Tidak ada berkas yang cocok.</p>'}</div>${no.length?`<p class="hint">Tidak cocok (${no.length}): ${esc(no.slice(0,6).map(x=>x.name).join(', '))}${no.length>6?', …':''}</p>`:''}<div class="modal-actions"><button class="secondary" data-act="close-modal">Batal</button><button class="primary" data-v12="b3-lrc-apply">Terapkan ${ok.filter(([it])=>it.on).length} lirik</button></div>`);}
async function v12LrcApply(b){const L=v12c.lrc;if(!L||v12c.busy)return;v12c.busy=true;b.disabled=true;b.textContent='Menyimpan…';let n=0,skip=0,bad=0;try{for(const it of L.items){if(!it.id||!it.on)continue;if(!it.text){bad++;continue;}const old=await dbGet('lyrics',it.id);if(old&&old.text&&!L.over){skip++;continue;}const lrc=/\[\d{1,2}:\d{2}/.test(it.text)&&parseLRC(it.text).length>0;await dbPut('lyrics',{id:it.id,type:lrc?'lrc':'plain',text:it.text,updatedAt:Date.now()});const lt=getTrack(it.id);if(lt&&!lt.lang){try{const g=guessLang(it.text);if(g){lt.lang=g;await dbPut('tracks',lt);}}catch{}}n++;}await refreshData();v12c.lrc=null;closeModal();render();toast(n+' lirik ditambahkan'+(skip?', '+skip+' dilewati (sudah ada lirik)':'')+(bad?', '+bad+' berkas kosong':'')+'.');}catch(e){toast('Impor lirik gagal: '+(e&&e.message||e));b.disabled=false;b.textContent='Terapkan';}finally{v12c.busy=false;}}

/* --- mode karaoke --- */

function v12PinHash(pin,salt,rounds){const p=V12D_ENC.encode(String(pin));let cur=new Uint8Array(salt.length+p.length);cur.set(salt);cur.set(p,salt.length);cur=v12Sha(cur);const buf=new Uint8Array(32+salt.length+p.length);buf.set(salt,32);buf.set(p,32+salt.length);for(let i=1;i<rounds;i++){buf.set(cur,0);cur=v12Sha(buf);}return cur;}

function v12PinCfg(){try{const j=JSON.parse(localStorage.getItem('sonora-pin')||'null');if(j&&typeof j.salt==='string'&&typeof j.hash==='string'&&(j.len===4||j.len===6))return j;}catch{}return null;}

function v12PinMake(pin,len,after){const salt=new Uint8Array(16);crypto.getRandomValues(salt);const rounds=20000;return{v:1,salt:v12Hex(salt),hash:v12Hex(v12PinHash(pin,salt,rounds)),len,rounds,after};}

function v12PadHTML(act){return `<div class="v12-pad">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k===''?'<span></span>':`<button data-v12="${act}" data-k="${k}" aria-label="${k==='⌫'?'Hapus':k}">${k}</button>`).join('')}</div>`;}

async function v12LockKey(k){const cfg=v12PinCfg();if(!cfg){v12LockHide();return;}if(v12d.lockBusy)return;const f=v12FailGet();if(f.until>Date.now()){v12LockWait();return;}if(k==='⌫')v12d.buf=v12d.buf.slice(0,-1);else if(/^\d$/.test(k)&&v12d.buf.length<cfg.len)v12d.buf+=k;v12LockPaint();if(v12d.buf.length!==cfg.len)return;v12d.lockBusy=true;try{const pin=v12d.buf;await new Promise(r=>setTimeout(r,60));if(v12PinOk(cfg,pin)){v12FailSet(0,0);v12LockHide();return;}const n=f.n+1,until=n%5===0?Date.now()+Math.min(900,30*Math.pow(2,n/5-1))*1000:0;v12FailSet(n,until);v12d.buf='';v12LockPaint();const d=$('#v12-lkdots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}try{navigator.vibrate&&navigator.vibrate(90);}catch{}if(until)v12LockWait();else v12LockSay('PIN salah. Sisa '+(5-(n%5))+' percobaan sebelum dijeda.',true);}finally{v12d.lockBusy=false;}}

async function v12ZipRun(){if(v12d.zip)return;v12d.zip=true;const say=(p,t)=>{const b=$('#v12z-bar'),x=$('#v12z-txt');if(b)b.style.width=Math.round(p*100)+'%';if(x)x.textContent=t;};showModal('Cadangan ZIP','<div class="v12-prog"><i id="v12z-bar"></i></div><p class="hint" id="v12z-txt">Menyiapkan…</p><div class="notice">Jangan tutup atau pindah dari SONORA sampai selesai.</div>');try{const meta={app:'SONORA',version:'0.1.0',zip:1,createdAt:new Date().toISOString(),tracks:await dbGetAll('tracks'),playlists:await dbGetAll('playlists'),lyrics:await dbGetAll('lyrics'),history:await dbGetAll('history'),settings:await dbGetAll('settings'),links:await dbGetAll('links'),artworks:state.db.objectStoreNames.contains('artworks')?await dbGetAll('artworks'):[]},files=[],man=[],withA=meta.tracks.filter(t=>t.hasAudio);let miss=0,i=0;for(const t of withA){say(.02+.28*(i/Math.max(1,withA.length)),'Membaca audio '+(i+1)+' dari '+withA.length+'…');i++;const rec=await dbGet('audio',t.id);if(!rec||!rec.blob){miss++;continue;}const m=/\.([A-Za-z0-9]{1,5})$/.exec(t.fileName||''),path='audio/'+String(files.length).padStart(5,'0')+'.'+(m?m[1].toLowerCase():'bin');files.push({name:path,blob:rec.blob});man.push({id:t.id,path,size:rec.blob.size,mime:rec.blob.type||t.mime||''});}meta.files=man;const total=files.reduce((n,f)=>n+f.blob.size,0);if(total>3.8e9)throw new Error('Ukuran audio '+fmtSize(total)+' melebihi batas satu arsip ZIP (±3,8 GB).');const all=[{name:'sonora-backup.json',blob:new Blob([JSON.stringify(meta)],{type:'application/json'})},...files];let lastT=0;const zip=await v12ZipBuild(all,(k,n)=>{const now=Date.now();if(now-lastT>120||k===n){lastT=now;say(.3+.66*(k/n),'Membuat arsip '+k+' dari '+n+'…');}});say(.98,'Menyimpan berkas…');v12Dl(zip,'sonora-cadangan-'+v12Stamp()+'.zip');try{localStorage.setItem('sonora-backup-at',Date.now());}catch{}showModal('Cadangan ZIP',`<div class="stats-grid"><div class="stat"><b>${man.length}</b><span>Lagu</span></div><div class="stat"><b>${fmtSize {const cp=countPlay;countPlay=async function(){const was=state.counted,r=await cp.apply(this,arguments);if(!was&&state.counted&&state.currentId){const L=v12d.rl;if(!L.since)L.since=Date.now();L.ev.push([state.currentId,Date.now()]);if(L.ev.length>30000)L.ev.splice(0,L.ev.length-30000);v12RlSave();}return r;};const fl=flushListening;flushListening=async function(id){const s=state.listenedPending,r=await fl.apply(this,arguments);if(id&&s>0){const L=v12d.rl,k=v12Day(Date.now());L.sec[k]=(L.sec[k]||0)+s;const ks=Object.keys(L.sec);if(ks.length>800){ks.sort();ks.slice(0,ks.length-800).forEach(x=>delete L.sec[x]);}v12RlSave();}return r;};}

function v12DomPick(px){const bins=Array.from({length:24},()=>({w:0,x:0,y:0,s:0,l:0}));let tw=0;for(let i=0;i<px.length;i+=4){if(px[i+3]<128)continue;const r=px[i]/255,g=px[i+1]/255,b=px[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,dd=mx-mn;if(dd<.02)continue;const s=dd/(1-Math.abs(2*l-1)||1);if(s<.2||l<.12||l>.92)continue;let h=mx===r?((g-b)/dd)%6:mx===g?(b-r)/dd+2:(r-g)/dd+4;h*=60;if(h<0)h+=360;const w=s*(1-Math.abs(2*l-1)),B=bins[Math.floor(h/15)%24],a=h*Math.PI/180;B.w+=w;B.x+=Math.cos(a)*w;B.y+=Math.sin(a)*w;B.s+=s*w;B.l+=l*w;tw+=w;}if(tw<8)return{h:0,s:0,l:.5,gray:true};let best=bins[0];for(const B of bins)if(B.w>best.w)best=B;let h=Math.atan2(best.y,best.x)*180/Math.PI;if(h<0)h+=360;return{h:Math.round(h),s:best.s/best.w,l:best.l/best.w,gray:false};}

function v12AccPage(){const on=v12.cfg.accent;return `<button class="text-link" data-act="nav" data-page="settings">${icon('back',15)} Pengaturan</button><p class="eyebrow" style="margin-top:10px">TAMPILAN</p><h1 class="page-title">Warna Aksen</h1><p class="page-sub">Warna tombol dan sorotan mengikuti sampul lagu yang sedang diputar.</p><div class="section"><div class="settings-row"><span class="copy"><strong>Warna aksen dinamis</strong><small>Diambil dari warna dominan sampul, lalu disesuaikan supaya tetap terbaca di tema terang dan gelap</small></span><button class="switch ${on?'on':''}" data-v12="sw" data-key="accent" aria-label="Warna aksen dinamis"></button></div></div><div class="notice">Berlaku untuk lagu yang punya sampul berwarna. Lagu tanpa sampul, atau sampul hitam-putih, memakai warna tema biasa. Teks dan latar tidak berubah, hanya warna aksen.</div>`;}

/* --- EQ per lagu --- */
function v12EqB(){const t=activeTrack();return t&&Array.isArray(t.eqBands)&&t.eqBands.length===10?t.eqBands:state.eq.bands;}
function v12EqSet(arr){const t=activeTrack();if(t&&Array.isArray(t.eqBands)){t.eqBands=arr;dbPut('tracks',t).catch(()=>{});}else state.eq.bands=arr;}
function v12EqApplyNow(){if(!state.audioCtx||!state.filters.length)return;const b=v12EqB(),c=state.audioCtx;state.filters.forEach((f,i)=>{const v=state.eq.enabled?(Number(b[i])||0):0;try{if(f.gain.setTargetAtTime)f.gain.setTargetAtTime(v,c.currentTime,.04);else f.gain.value=v;}catch{f.gain.value=v;}});v12Norm();}
function v12EqCard(){const t=activeTrack();if(!t)return '<div class="muted-card"><strong>EQ Khusus Lagu</strong><p>Putar sebuah lagu untuk mengatur EQ khusus lagu itu.</p></div>';const on=Array.isArray(t.eqBands);return `<div class="audio-feature"><span><strong>EQ Khusus Lagu Ini</strong><small>${esc(tx(t))} · ${on?'aktif':'memakai EQ umum'}</small></span><button class="switch ${on?'on':''}" data-v12="b4-eq-t" aria-label="EQ khusus lagu ini"></button></div>${on?'<div class="notice">Slider di bawah mengatur EQ khusus lagu ini. Lagu lain tetap memakai EQ umum.</div>':''}`;}

/* --- perbaikan sampul lagu potongan lama --- */
async function v12CoverFix(){if(await setting('v12coverfix',0))return;let n=0;for(const t of state.tracks){if(t.coverDataUrl)continue;const m=/^(.*) \(potongan\)$/.exec(t.title||'');if(!m)continue;const s=state.tracks.find(x=>x.id!==t.id&&x.coverDataUrl&&(x.title===m[1]||tx(x)===m[1]));if(s){t.coverDataUrl=s.coverDataUrl;await dbPut('tracks',t);n++;}}await saveSetting('v12coverfix',1);if(n){await refreshData();toast(n+' lagu potongan mendapat sampul dari lagu asalnya.');}}
{const vl=v12Load;v12Load=async function(){await vl.apply(this,arguments);try{const x=await setting('v12rec',null);if(x&&Array.isArray(x.ev))v12d.rl={since:Number(x.since)||0,ev:x.ev.filter(e=>Array.isArray(e)&&typeof e[0]==='string'&&Number.isFinite(e[1])),sec:x.sec&&typeof x.sec==='object'?x.sec:{}};await v12CoverFix();}catch(e){log('V12 B4 muat gagal: '+(e&&e.message),'warning');}};}

/* --- panduan --- */
function v12GuideGroup4(){return ['Cadangan, Keamanan & Personalisasi',[['Cadangan ZIP','Pengaturan → Cadangan & Pulihkan → Buat Cadangan ZIP. Arsip berisi audio, sampul, lirik, playlist, rating, label, dan pengaturan. Pulihkan dari ZIP menggabungkannya ke koleksi: lagu yang sudah ada tidak ditimpa, dan lagu yang hanya punya metadata mendapat audionya kembali. Batas satu arsip sekitar 3,8 GB.'],['Kunci PIN','Pengaturan → Keamanan. PIN 4 atau 6 angka diminta saat SONORA dibuka dan saat kembali dari latar belakang (waktunya bisa diatur). PIN hanya mengunci tampilan, tidak mengenkripsi data, dan tidak bisa dipulihkan kalau lupa. PIN tidak ikut tersimpan di cadangan.'],['Bagikan','Menu titik tiga lagu → Bagikan: kirim berkas audio, kartu lagu berupa gambar, lirik, atau info lagu. Menu playlist punya Bagikan Daftar Lagu. Kalau berbagi berkas tidak didukung perangkat, berkas diunduh.'],['Impor Folder','Pengaturan → Impor Folder & Bagikan. Pilih satu folder, SONORA mengimpor semua audio di dalamnya, bisa memakai nama folder sebagai album, dan mencocokkan berkas .lrc. Di sebagian HP pemilih folder tidak tersedia; pakai impor biasa dan pilih banyak berkas.'],['Rekap Mendengar','Pengaturan → Rekap Mendengar, atau tombol di halaman Statistik. Ringkasan 7 hari, 30 hari, tahun ini, dan semua waktu: lagu, artis, genre teratas, jam mendengar, serta kartu gambar untuk dibagikan. Rekap per periode dihitung sejak fitur ini mulai mencatat.'],['EQ Per Lagu','Halaman Ekualiser → EQ Khusus Lagu Ini, atau menu titik tiga lagu → EQ Khusus Lagu. Lagu itu memakai pengaturan band sendiri, lagu lain tetap memakai EQ umum. Ekualiser otomatis dinyalakan.'],['Warna Aksen Dinamis','Pengaturan → Warna Aksen. Warna tombol dan sorotan mengikuti warna dominan sampul lagu yang diputar, dengan kecerahan disesuaikan untuk tema terang dan gelap. Default-nya mati.']]];}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-v12]');if(!b)return;const a=b.dataset.v12;if(!a||a.slice(0,3)!=='b4-')return;const id=b.dataset.id;try{
if(a==='b4-lk'){v12LockKey(b.dataset.k);return;}
if(a==='b4-lk-help'){v12d.help=!v12d.help;const h=$('#v12-lkhelp');if(h)h.hidden=!v12d.help;return;}
if(a==='b4-pin-set'){v12PinFlowOpen('set');return;}
if(a==='b4-pin-change'){v12PinFlowOpen('change');return;}
if(a==='b4-pin-off'){v12PinFlowOpen('off');return;}
if(a==='b4-pin-now'){v12LockShow();return;}
if(a==='b4-pin-len'){const f=v12d.flow;if(!f)return;f.len=Number(b.dataset.n)===6?6:4;f.step='new';f.buf='';v12PinFlowDraw();return;}
if(a==='b4-pk'){v12PinFlowKey(b.dataset.k);return;}
if(a==='b4-after'){const cfg=v12PinCfg();if(!cfg)return;cfg.after=Number(b.dataset.s);v12PinSave(cfg);render();return;}
if(a==='b4-zip-open'){v12ZipOpen();return;}
if(a==='b4-zip-run'){await v12ZipRun();return;}
if(a==='b4-zip-pick'){v12ZipPick();return;}
if(a==='b4-fld-pick'){await v12FolderPick();return;}
if(a==='b4-fld-opt'){const F=v12d.fld;if(!F)return;F[b.dataset.k]=!F[b.dataset.k];v12FolderShow(F.other,F.nd);return;}
if(a==='b4-fld-go'){await v12FolderGo();return;}
if(a==='b4-fld-lrc'){const f=v12d.fldLrc;v12d.fldLrc=[];if(f.length)await v12LrcMatch(f);return;}
if(a==='b4-recp'){v12d.recP=b.dataset.p;render();return;}
if(a==='b4-rec-open'){state.settingsSection='Rekap Mendengar';state.previousPage=state.page;state.page='settings-detail';render();return;}
if(a==='b4-rec-share'){b.disabled=true;try{const blob=await v12RecCard(v12d.recP);if(!blob){toast('Gagal membuat gambar.');return;}const r=await v12Deliver(blob,'sonora-rekap-'+v12Stamp()+'.png','Rekap Mendengar SONORA','');if(r==='saved')toast('Berbagi tidak didukung di sini. Gambar diunduh.');}finally{b.disabled=false;}return;}
if(a==='b4-menu-share'){closeModal();v12ShareOpen(id);return;}
if(a==='b4-sh-audio'||a==='b4-sh-card'||a==='b4-sh-lyr'||a==='b4-sh-info'){await v12ShareDo(a,id);return;}
if(a==='b4-pl-share'){v12PlShare(id);return;}
if(a==='b4-eq-t'){const t=activeTrack();if(!t)return;if(Array.isArray(t.eqBands))delete t.eqBands;else{t.eqBands=[...state.eq.bands];if(!state.eq.enabled){state.eq.enabled=true;if(!await initEQ()){state.eq.enabled=false;delete t.eqBands;toast('Ekualiser tidak tersedia di perangkat ini.');render();return;}await saveSetting('eq',state.eq);}}await dbPut('tracks',t);await refreshData();v12EqApplyNow();render();return;}
if(a==='b4-menu-eq'){closeModal();if(state.currentId!==id)await startList([id],id);setPage('eq');toast('Atur EQ untuk lagu yang sedang diputar.');return;}
}catch(err){log('V12 aksi B4 gagal: '+(err&&err.message),'error');toast('Aksi gagal: '+(err&&err.message));}});

v12LockShow();

decorate();

init();
})();

 function translateText(value){
